# Standalone Fieldmind deployment. Run from this folder with its own private .env.
name: taxnorge-fieldmind

x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    logging: *bounded-logs
    volumes:
      - vectors:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12

  ollama:
    image: ollama/ollama:0.13.5
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  models-init:
    image: ollama/ollama:0.13.5
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    logging: *bounded-logs
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull qwen3-embedding:0.6b"]

  reranker:
    image: docker.io/${TAXGUIDE_IMAGE_NAMESPACE:?Set the Docker Hub namespace}/taxguide-reranker:${TAXGUIDE_IMAGE_TAG:?Set the published release tag}
    platform: linux/amd64
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      HF_HOME: /models/huggingface
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - reranker-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 120

  api:
    image: docker.io/${TAXGUIDE_IMAGE_NAMESPACE:?Set the Docker Hub namespace}/taxguide-api:${TAXGUIDE_IMAGE_TAG:?Set the published release tag}
    platform: linux/amd64
    restart: unless-stopped
    logging: *bounded-logs
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      TAXGUIDE_CONFIG: configs/base.yaml
      TAXGUIDE_OVERLAY: /app/deployment/vertex.yaml
      TAXGUIDE_ADMIN_TOKEN: ${TAXGUIDE_ADMIN_TOKEN:?Set a random operator token of at least 32 characters in .env}
      TAXGUIDE_SERVICE_ORIGINS: https://aiplatform.eu.rep.googleapis.com
      GOOGLE_CLOUD_PROJECT: eduardo-taxnorge
    volumes:
      - app-data:/app/data
      - ./vertex.yaml:/app/deployment/vertex.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 5m

  frontend:
    image: docker.io/${TAXGUIDE_IMAGE_NAMESPACE:?Set the Docker Hub namespace}/taxguide-frontend:${TAXGUIDE_IMAGE_TAG:?Set the published release tag}
    platform: linux/amd64
    restart: unless-stopped
    logging: *bounded-logs
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:3000"
    environment:
      TAXGUIDE_API_URL: http://api:8000

volumes:
  vectors:
  app-data:
  ollama-models:
  reranker-models:
