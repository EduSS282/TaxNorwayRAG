[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taxguide-norway"
version = "0.1.0"
description = "Typed local ingestion of Norwegian tax documentation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3", "PyYAML>=6,<7", "typer>=0.12,<1", "selectolax>=0.3,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML>=6", "pre-commit>=4,<5"]

[project.scripts]
taxguide = "taxguide.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/taxguide"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=taxguide --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["selectolax.*"]
ignore_missing_imports = true
