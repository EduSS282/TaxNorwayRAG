# Standalone Linux stack. Configure .env from .env.single-host.example, then docker compose up --build -d.
name: taxguide-single-host

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    volumes:
      - vectors:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12

  ollama:
    image: ollama/ollama:0.13.5
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  models-init:
    image: ollama/ollama:0.13.5
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      PULL_LOCAL_GENERATOR: ${TAXGUIDE_PULL_LOCAL_GENERATOR:-true}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ollama pull qwen3-embedding:0.6b
        if [ "$${PULL_LOCAL_GENERATOR}" = "true" ]; then
          ollama pull qwen3:4b-instruct-2507-q4_K_M
        fi

  reranker:
    build:
      context: .
      dockerfile: Dockerfile.reranker
    restart: unless-stopped
    environment:
      HF_HOME: /models/huggingface
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - reranker-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 120

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      TAXGUIDE_CONFIG: configs/base.yaml
      TAXGUIDE_OVERLAY: configs/single-host.yaml
      TAXGUIDE_ADMIN_TOKEN: ${TAXGUIDE_ADMIN_TOKEN:?Set a random operator token of at least 32 characters in .env}
      TAXGUIDE_SERVICE_ORIGINS: ${TAXGUIDE_SERVICE_ORIGINS:-https://aiplatform.googleapis.com}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - ./configs:/app/configs:ro
      - app-data:/app/data
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 5m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TAXGUIDE_UI_PORT:-3000}:3000"
    environment:
      TAXGUIDE_API_URL: http://api:8000

volumes:
  vectors:
  app-data:
  ollama-models:
  reranker-models:
