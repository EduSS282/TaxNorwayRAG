name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: docker compose -f compose.yaml -f compose.production.yaml config --quiet
      - run: docker compose -f compose.single-host.yaml config --quiet
        env:
          TAXGUIDE_ADMIN_TOKEN: ci-config-validation-only-no-cloud-credentials
      - run: docker compose -f compose.demo.yaml config --quiet
        env:
          TAXGUIDE_ADMIN_TOKEN: ci-config-validation-only-no-cloud-credentials
          TAXGUIDE_IMAGE_NAMESPACE: eduss28
          TAXGUIDE_IMAGE_TAG: sha-${{ github.sha }}
      - run: docker compose --env-file deployments/fieldmind-gcp/.env.example -f deployments/fieldmind-gcp/compose.yaml config --quiet
        env:
          TAXGUIDE_ADMIN_TOKEN: ci-config-validation-only-no-cloud-credentials
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.yaml -f compose.production.yaml up -d --wait --wait-timeout 180 --build qdrant api frontend
      - run: |
          curl --retry 20 --retry-delay 2 --retry-all-errors --fail --show-error --silent http://127.0.0.1:8000/v1/health | python -c "import json,sys; assert json.load(sys.stdin)['status'] == 'ok'"
          curl --retry 20 --retry-delay 2 --retry-all-errors --fail --show-error --silent --output /dev/null http://127.0.0.1:3000/
          curl --retry 20 --retry-delay 2 --retry-all-errors --fail --show-error --silent -H 'Content-Type: application/json' -d '{"question":"Which NGO should I support?","mode":"dense"}' http://127.0.0.1:3000/api/query | python -c "import json,sys; assert json.load(sys.stdin)['status'] == 'clarification_required'"
      - if: always()
        run: docker compose -f compose.yaml -f compose.production.yaml down
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, frontend, deployment]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: Dockerfile.api
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
          - name: reranker
            context: .
            file: Dockerfile.reranker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: eduss28
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: docker.io/eduss28/taxguide-${{ matrix.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=demo-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=demo-${{ matrix.name }}
  demo-bundle:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deployment files for this exact image release
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          mkdir -p dist/demo
          cp compose.demo.yaml dist/demo/
          cp docs/image-deployment.md dist/demo/README.md
          cp docs/single-host-deployment.md dist/demo/
          sed -e 's/^TAXGUIDE_IMAGE_NAMESPACE=$/TAXGUIDE_IMAGE_NAMESPACE=eduss28/' -e "s/^TAXGUIDE_IMAGE_TAG=$/TAXGUIDE_IMAGE_TAG=${IMAGE_TAG}/" .env.demo.example > dist/demo/.env.demo.example
      - uses: actions/upload-artifact@v4
        with:
          name: taxguide-demo-sha-${{ github.sha }}
          path: dist/demo/
          include-hidden-files: true
      - name: Prepare Fieldmind IAP deployment
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          mkdir -p dist/fieldmind-gcp
          cp deployments/fieldmind-gcp/compose.yaml deployments/fieldmind-gcp/vertex.yaml deployments/fieldmind-gcp/README.md dist/fieldmind-gcp/
          sed "s/^TAXGUIDE_IMAGE_TAG=.*/TAXGUIDE_IMAGE_TAG=${IMAGE_TAG}/" deployments/fieldmind-gcp/.env.example > dist/fieldmind-gcp/.env.example
          tar -czf dist/fieldmind-gcp.tar.gz -C dist fieldmind-gcp
      - uses: actions/upload-artifact@v4
        with:
          name: taxnorge-fieldmind-sha-${{ github.sha }}
          path: dist/fieldmind-gcp.tar.gz
